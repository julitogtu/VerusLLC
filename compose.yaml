services:
  api:
    build:
      context: .
      dockerfile: src/VerusLLC.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${API_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: src/VerusLLC.App
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
